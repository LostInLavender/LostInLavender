<!DOCTYPE html>
<head>
  <title>𝐿𝑒𝓉𝓉𝑒𝓇 𝒯𝑜 𝐻𝑒𝒶𝓉𝒽𝑒𝓇</title>
  <link rel="icon" type="image/png" href="lil icon.png">
  
  <style>

    .html, body {
      background-color: black;
    }

    body{
    margin:0;

    background:black;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.letter-container{
    position:relative;
}

.letter{
    width:700px;
    display:block;
}

#nameInput{
    position:absolute;

    bottom:120px;
    left:50%;

    transform:translateX(-50%);

    width:250px;
}

#continueBtn{
    position:absolute;

    bottom:70px;
    left:50%;

    transform:translateX(-50%);
    font-family: Georgia, 'Times New Roman', Times, serif;
    width: 100px;
    background-color: blueviolet;
    cursor: pointer;
}
#continueBtn :hover {
  background-color: rgb(255, 149, 237);
}
  </style>

</head>

<body>

  <div class="letter-container">

    <img src="letter bg.jpg" class="letter">

    <input
        type="text"
        id="nameInput"
        placeholder="Write your name..."
        style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;"
        autocomplete="off"
    >

    <button
    id="continueBtn"
    disabled
    onclick="window.location.href='lilavender.html'"
>
    Continue
    </button>

    <script>

     const input = document.getElementById("nameInput");
     const button = document.getElementById("continueBtn");

     input.addEventListener("input", function(){

    button.disabled = input.value.trim().length < 2;

});

</script>

</div>

</body>
